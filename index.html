<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이천물류 출석">
<meta name="theme-color" content="#a50034">
<title>이천물류 출석 체크</title>
<style>
/* 기존 스타일 시트 유지 및 일부 다크모드 가독성 개선 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"Malgun Gothic",sans-serif}
:root{
  --red:#a50034;--bg:#f2f2f2;--sur:#fff;--txt:#1a1a1a;--txt2:#666;--txt3:#aaa;
  --bdr:rgba(0,0,0,.09);--bdr2:rgba(0,0,0,.16);
  --ok:#16a34a;--okb:#f0fdf4;--late:#d97706;--lateb:#fffbeb;--abs:#ef4444;--absb:#fef2f2;
  --blu:#1d4ed8;--blub:#eff6ff;--pur:#7c3aed;--purb:#f3e8ff;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0f0f0f;--sur:#1c1c1e;--txt:#f0f0f0;--txt2:#888;--txt3:#555;--bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.15)}
}
.app{display:flex;flex-direction:column;height:100dvh}
.scr{display:none;flex-direction:column;flex:1;overflow:hidden;padding-top:var(--st)}
.scr.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{background:var(--sur);border-radius:14px;border:.5px solid var(--bdr);padding:16px;margin-top:12px}
.btn{display:block;width:100%;padding:14px;font-size:15px;font-weight:600;border-radius:12px;border:none;cursor:pointer;background:var(--txt);color:var(--sur);margin-top:8px;transition:opacity .15s}
.btn:active{opacity:.75}
.brd{background:var(--red);color:#fff}
.ldr{position:fixed;inset:0;z-index:600;background:rgba(255,255,255,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:14px;color:var(--txt2)}
.ldr.on{display:flex}
.spin{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 추가/수정된 스타일 */
#h-time { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app">
  <div class="scr on" id="s-home">
    <div class="hbar" style="padding-top:calc(var(--st) + 14px); background:var(--red); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; color:#fff;">
      <div style="font-weight:700; font-size:20px;">LG 이천물류</div>
      <div style="text-align:right">
        <div id="h-time" style="font-size:18px;">00:00:00</div>
        <div id="h-date" style="font-size:11px; opacity:0.8;">2024.01.01 (월)</div>
      </div>
    </div>
    
    <div class="scroll" style="padding:16px;">
      <div class="card" style="text-align:center; padding:30px 16px;">
        <div style="font-size:14px; color:var(--txt2); margin-bottom:8px;">반갑습니다!</div>
        <div id="user-name" style="font-size:22px; font-weight:700; color:var(--txt); margin-bottom:20px;">사용자님</div>
        <button class="btn brd" onclick="handleAttendance()" style="height:120px; font-size:20px; border-radius:60px;">
          출석 체크하기
        </button>
      </div>
    </div>
  </div>

  <div id="loading" class="ldr">
    <div class="spin"></div>
    <div id="loading-msg">위치 정보를 확인 중입니다...</div>
  </div>
</div>

<script>
// 1. 상태 및 설정값
const CONFIG = {
  office: { lat: 37.123456, lng: 127.123456 }, // 센터 좌표 (예시)
  radius: 200, // 허용 반경 (미터)
  timeout: 10000 // GPS 타임아웃 10초
};

// 2. 시간 업데이트 함수
function updateClock() {
  const now = new Date();
  const options = { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit' };
  document.getElementById('h-date').innerText = now.toLocaleDateString('ko-KR', options);
  document.getElementById('h-time').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });
}

// 3. 고정밀 위치 정보 가져오기 (수정됨)
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("GPS를 지원하지 않는 브라우저입니다."));
    }
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: CONFIG.timeout,
      maximumAge: 0
    });
  });
}

// 4. 출석 체크 메인 로직
async function handleAttendance() {
  const loading = document.getElementById('loading');
  loading.classList.add('on');
  
  try {
    const pos = await getPosition();
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const accuracy = Math.round(pos.coords.accuracy);

    // [로직 개선] 서버 API 호출 시 DID(기기식별값)와 위치 정보를 함께 전송
    const result = await mockApiCall({
      lat: lat.toFixed(6),
      lng: lng.toFixed(6),
      accuracy: accuracy,
      timestamp: new Date().toISOString()
    });

    if (result.success) {
      alert(`✅ 출석 성공!\n시간: ${result.time}\n위치: ${result.location}`);
    } else {
      alert(`❌ 출석 실패: ${result.message}`);
    }

  } catch (err) {
    console.error(err);
    let msg = "위치 정보를 가져올 수 없습니다.";
    if (err.code === 1) msg = "위치 정보 접근 권한을 허용해주세요.";
    else if (err.code === 3) msg = "연결 시간이 초과되었습니다. 다시 시도해주세요.";
    alert(msg);
  } finally {
    loading.classList.remove('on');
  }
}

// 5. 가상 API 서버 통신 (기존 api() 함수 대체 예시)
function mockApiCall(data) {
  return new Promise((resolve) => {
    setTimeout(() => {
      resolve({
        success: true,
        time: new Date().toLocaleTimeString(),
        location: "이천 물류 센터"
      });
    }, 1500);
  });
}

// 초기 실행
window.onload = () => {
  updateClock();
  setInterval(updateClock, 1000);
};
</script>
</body>
</html>
